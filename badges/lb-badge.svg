<svg xmlns="http://www.w3.org/2000/svg" width="72" height="28" role="img" aria-label="Leaping Bunny certified">
  <rect width="72" height="28" rx="6" ry="6" fill="#1565c0"/>
  <!-- Bunny silhouette: body (leaping, slight angle) -->
  <ellipse cx="14" cy="17" rx="6" ry="4.5" fill="#90caf9" transform="rotate(-12 14 17)"/>
  <!-- Ears -->
  <ellipse cx="11" cy="10" rx="1.4" ry="3.5" fill="#90caf9" transform="rotate(10 11 10)"/>
  <ellipse cx="15.5" cy="9" rx="1.4" ry="3.5" fill="#90caf9" transform="rotate(-10 15.5 9)"/>
  <!-- Eye -->
  <circle cx="15" cy="15" r="1" fill="#0d47a1"/>
  <!-- Tail -->
  <circle cx="8" cy="18" r="1.5" fill="#90caf9"/>
  <!-- Text labels -->
  <text x="24" y="12" font-family="sans-serif" font-size="7" font-weight="bold" fill="#ffffff">Leaping</text>
  <text x="24" y="22" font-family="sans-serif" font-size="7" fill="#90caf9">Bunny</text>
</svg>
