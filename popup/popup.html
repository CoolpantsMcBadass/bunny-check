<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BunnyCheck</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fbe7;
      color: #1b2b1b;
      width: 260px;
      padding: 16px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .logo svg { display: block; }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: #2e7d32;
      line-height: 1;
    }

    .tagline {
      font-size: 10px;
      color: #558b2f;
      margin-top: 2px;
    }

    /* Stats card */
    .card {
      background: #ffffff;
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      line-height: 1.8;
    }

    .stat-label { color: #4a4a4a; }
    .stat-value { font-weight: 600; color: #2e7d32; }

    .divider {
      border: none;
      border-top: 1px solid #e8f5e9;
      margin: 6px 0;
    }

    /* Badge legend */
    .legend {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #4a4a4a;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-peta { background: #2e7d32; }
    .dot-lb   { background: #1565c0; }

    /* Footer links */
    .footer {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .footer a {
      font-size: 11px;
      color: #1565c0;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .footer a:hover { text-decoration: underline; }

    /* Loading / error state */
    .status-msg {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 6px 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <!-- Inline logo: green circle with a bunny silhouette -->
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="18" fill="#2e7d32"/>
        <ellipse cx="18" cy="22" rx="7" ry="8" fill="#a5d6a7"/>
        <ellipse cx="15" cy="12" rx="2" ry="5.5" fill="#a5d6a7"/>
        <ellipse cx="21" cy="12" rx="2" ry="5.5" fill="#a5d6a7"/>
        <circle cx="20" cy="20" r="1.4" fill="#1b5e20"/>
        <circle cx="22" cy="24" r="1.8" fill="#c8e6c9"/>
      </svg>
    </div>
    <div>
      <div class="title">BunnyCheck</div>
      <div class="tagline">Cruelty-free at a glance</div>
    </div>
  </div>

  <div class="card" id="stats-card">
    <p class="status-msg" id="loading-msg">Loading…</p>
    <div id="stats-content" style="display:none;">
      <div class="stat-row">
        <span class="stat-label">Brands in database</span>
        <span class="stat-value" id="brand-count">—</span>
      </div>
      <hr class="divider"/>
      <div class="stat-row">
        <span class="stat-label">PETA certified</span>
        <span class="stat-value" id="peta-count">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Leaping Bunny certified</span>
        <span class="stat-value" id="lb-count">—</span>
      </div>
      <hr class="divider"/>
      <div class="stat-row">
        <span class="stat-label">Data version</span>
        <span class="stat-value" id="data-version">—</span>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="dot dot-peta"></div>
      <span>PETA Cruelty-Free</span>
    </div>
    <div class="legend-item">
      <div class="dot dot-lb"></div>
      <span>Leaping Bunny</span>
    </div>
  </div>

  <div class="footer">
    <a href="https://github.com/CoolpantsMcBadass/bunny-check/issues" target="_blank" rel="noopener noreferrer">
      ↗ Report an issue or missing brand
    </a>
    <a href="https://www.peta.org/living/personal-care-fashion/beauty-without-bunnies/" target="_blank" rel="noopener noreferrer">
      ↗ PETA Beauty Without Bunnies
    </a>
    <a href="https://www.leapingbunny.org/guide/brands" target="_blank" rel="noopener noreferrer">
      ↗ Leaping Bunny brand search
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
